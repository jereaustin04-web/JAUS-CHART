<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

<h1>🎵 My Music Player</h1>

<input type="file" id="fileInput" accept="audio/*" multiple>

<h2 id="songTitle">No Song Selected</h2>

<audio id="audio"></audio>

<div class="buttons">
<button onclick="previousSong()">⏮</button>
<button id="playBtn" onclick="playPause()">▶️</button>
<button onclick="nextSong()">⏭</button>
</div>

<div class="buttons">
<button onclick="repeatSong()">🔁</button>
<button onclick="shuffle()">🔀</button>
<button onclick="downloadSong()">⬇️</button>
</div>

<input type="range" id="progress" value="0">

<p>
<span id="current">0:00</span> /
<span id="duration">0:00</span>
</p>

<label>🔊 Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.01" value="1">

<h3>Playlist</h3>

<ul id="playlist"></ul>

</div>

<script src="script.js"></script>

</body>
  </html>
