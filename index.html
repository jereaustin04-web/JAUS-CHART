<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music Player</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

.player{
    max-width:400px;
    margin:auto;
    background:#222;
    padding:20px;
    border-radius:20px;
}

h1{
    color:#00e676;
}

#date{
    color:#ccc;
}

input{
    margin:15px;
}

button{
    padding:12px 18px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
}

button:hover{
    background:#00a844;
}

audio{
    width:100%;
    margin-top:15px;
}

ul{
    list-style:none;
    padding:0;
}

li{
    background:#333;
    margin:5px;
    padding:10px;
    border-radius:8px;
}

.active{
    background:#00c853;
}

</style>

</head>

<body>

<div class="player">

<h1>🎵 My Music Player</h1>

<p id="date"></p>

<input type="file" id="fileInput" accept="audio/*" multiple>

<h3 id="songName">No Song Selected</h3>

<audio id="audio" controls></audio>

<br>

<button onclick="prevSong()">⏮ Previous</button>
<button onclick="playSong()">▶ Play</button>
<button onclick="pauseSong()">⏸ Pause</button>
<button onclick="nextSong()">⏭ Next</button>


<ul id="playlist"></ul>
